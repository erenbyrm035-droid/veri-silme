version: 2

# ============================================================================
# Bağımlılık güncelleme robotu.
#
# NEDEN GRUPLU: tek tek PR açtırmak haftada onlarca PR demek ve hiçbiri
# gözden geçirilmez. Güncellemeler üç kovaya ayrıldı; her kova için tek PR.
#
# GÜVENLİK YAMALARI AYRI: `security-updates` grubu şiddet gözetmeksizin
# hepsini toplar ve `guvenlik` etiketiyle gelir — sıradan sürüm yükseltme
# gürültüsünün içinde kaybolmasın diye.
# ============================================================================

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    labels:
      - bagimlilik
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"

    groups:
      # Next + React çekirdeği birlikte yükselmeli; ayrı ayrı PR'lar
      # birbiriyle uyumsuz sürüm çiftleri üretir.
      next-cekirdek:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "eslint-config-next"
          - "@next/*"

      # Geliştirme araçları — üretim paketine girmiyor, düşük risk.
      gelistirme:
        dependency-type: development

      # Kalan üretim bağımlılıkları.
      uretim:
        dependency-type: production
        exclude-patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@next/*"
          # iyzipay bilerek dışarıda: sürüm değişimi ödeme akışını etkiler,
          # elle ve test ederek yükseltilmeli. Gerekçe:
          # docs/guvenlik-notlari.md
          - "iyzipay"

  # GitHub Actions sürümleri de eskiyor (ör. Node 20 deprecation uyarısı).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - bagimlilik
      - ci
